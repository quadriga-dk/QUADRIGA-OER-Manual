name: Deploy book with Python, SPARQL, and R

on:
  workflow_run:
    workflows: ["Update Metadata"]
    types:
      - completed
    branches:
      - main

# This job installs dependencies, builds the book, and deploys it to GitHub Pages
# only runs if "Update Metadata" workflow is successful
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # Set up Python with pip caching
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: '.python-version'
        cache: pip

    # Set up R with dependency caching
    - name: Set up R
      uses: r-lib/actions/setup-r@v2

    # Cache executed notebooks
    # only caches if set up in _config.yml with:
    # execute:
    #   execute_notebooks: cache
    - name: Cache executed notebooks
      uses: actions/cache@v5
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # Install Python dependencies
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    # Install R dependencies with caching
    - name: Install R dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        cache: true
        cache-version: 2
        packages: |
          any::tidyverse
          any::IRkernel
        install-pandoc: false
        install-quarto: false

    # Register kernels with Jupyter.
    # IRkernel::installspec() shells out to `jupyter` from R and aborts with
    # "jupyter-client has to be installed" on newer Ubuntu runner images
    # (ubuntu-26.04) because that subprocess loses the toolcache Python's
    # site-packages. Install IRkernel's kernelspec from the Python side instead.
    - name: Set up IRkernel
      run: |
        kernel_dir="$(Rscript -e 'cat(system.file("kernelspec", package = "IRkernel"))')"
        jupyter kernelspec install --user --replace --name ir "$kernel_dir"

    - name: Install SPARQL kernel
      run: |
        jupyter sparqlkernel install --user

    # Check all kernels
    - name: Log all available kernels
      run: |
        jupyter kernelspec list

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Inject all metadata into HTML
      run: |
        python -m quadriga.metadata.inject_all_metadata
        echo "Injected all metadata (OpenGraph, JSON-LD, and RDF links) into HTML head"

    - name: Copy metadata files to build directory
      run: |
        cp quadriga-metadata.jsonld _build/html/quadriga-metadata.jsonld
        cp quadriga-metadata.rdf _build/html/quadriga-metadata.rdf
        echo "Copied metadata files to _build/html for discovery"

    - name: Upload book artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: "_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
